version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # one PR a week for the safe bumps; majors come one by one
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # pinned to what @sentry/nextjs ships with: bump these with Sentry
      - dependency-name: '@opentelemetry/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
