name: Run scheduled jobs

# Due-date reminders, notification emails, the weekly digest and purging
# deleted columns all run from /api/cron/run. This calls it every 5 minutes
# (GitHub may start a scheduled run a few minutes late; reminders allow for
# that).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: run-jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Require the APP_URL and CRON_SECRET secrets
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Add APP_URL and CRON_SECRET repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Run the jobs
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST "$APP_URL/api/cron/run" \
            -H "Authorization: Bearer $CRON_SECRET"
