name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Dummy values so import-time env reads don't fail during `next build`.
      # No job in this workflow talks to a real database or external service.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-dummy-secret
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy
      PUSHER_APP_ID: ci-dummy
      PUSHER_KEY: ci-dummy
      PUSHER_SECRET: ci-dummy
      PUSHER_CLUSTER: mt1
      NEXT_PUBLIC_PUSHER_KEY: ci-dummy
      NEXT_PUBLIC_PUSHER_CLUSTER: mt1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # Build first: it generates next-env.d.ts and .next/types,
      # which `tsc --noEmit` needs (next-env.d.ts is gitignored).
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@v4

      # Only main pushes a real image; PRs just build to validate the Dockerfile.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/noravutc/next-timecraft:latest
            ghcr.io/noravutc/next-timecraft:${{ github.sha }}
          # NEXT_PUBLIC_* are inlined into the public client bundle at build
          # time, so they are not secret — safe to keep in the repo. If the
          # Pusher key ever rotates, edit it here. (Real secrets like
          # PUSHER_SECRET / DATABASE_URL stay in .env.production on the server.)
          build-args: |
            NEXT_PUBLIC_PUSHER_KEY=5d804b66a55a28f9aeb7
            NEXT_PUBLIC_PUSHER_CLUSTER=ap1
