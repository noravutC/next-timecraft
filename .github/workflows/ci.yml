name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Dummy values so import-time env reads don't fail during `next build`.
      # Nothing in this workflow uses production credentials.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-dummy-secret
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy
      PUSHER_APP_ID: ci-dummy
      PUSHER_KEY: ci-dummy
      PUSHER_SECRET: ci-dummy
      PUSHER_CLUSTER: mt1
      NEXT_PUBLIC_PUSHER_KEY: ci-dummy
      NEXT_PUBLIC_PUSHER_CLUSTER: mt1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # Build first: it generates next-env.d.ts and .next/types,
      # which `tsc --noEmit` needs (next-env.d.ts is gitignored).
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: timecraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway Postgres from `services`; the rest are dummies. The tests
      # sign in with the guest provider (Google is never used) and realtime
      # broadcasts are fire-and-forget, so failed Pusher calls don't matter.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/timecraft
      NEXTAUTH_SECRET: ci-dummy-secret
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy
      PUSHER_APP_ID: ci-dummy
      PUSHER_KEY: ci-dummy
      PUSHER_SECRET: ci-dummy
      PUSHER_CLUSTER: mt1
      NEXT_PUBLIC_PUSHER_KEY: ci-dummy
      NEXT_PUBLIC_PUSHER_CLUSTER: mt1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      # playwright.config.ts serves this build with `pnpm start` on CI
      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm exec playwright test

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@v4

      # Only main pushes a real image; PRs just build to validate the Dockerfile.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/noravutc/next-timecraft:latest
            ghcr.io/noravutc/next-timecraft:${{ github.sha }}
          # NEXT_PUBLIC_* are inlined into the public client bundle at build
          # time, so they are not secret — safe to keep in the repo. If the
          # Pusher key ever rotates, edit it here. (Real secrets like
          # PUSHER_SECRET / DATABASE_URL stay in .env.production on the server.)
          build-args: |
            NEXT_PUBLIC_PUSHER_KEY=5d804b66a55a28f9aeb7
            NEXT_PUBLIC_PUSHER_CLUSTER=ap1
            NEXT_PUBLIC_SUPABASE_URL=https://egafogvlhftyzslzmkcv.supabase.co
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          # Source maps are uploaded for the image that ships, not for PR
          # builds. Without the secret the build skips the upload.
          secrets: |
            sentry_auth_token=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SENTRY_AUTH_TOKEN || '' }}
