name: CodeQL

# Static analysis for security bugs (injection, unsafe redirects, secrets in
# logs...). Findings show under Security > Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 19 * * 0' # Mondays 02:00 in Bangkok: new queries, old code

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript, actions
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
