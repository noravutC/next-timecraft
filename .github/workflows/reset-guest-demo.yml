name: Reset guest demo

# Every "Continue as guest" visitor shares one account, so the demo board
# drifts as people try things. This puts it back every night.
on:
  schedule:
    - cron: '0 20 * * *' # 03:00 in Bangkok
  workflow_dispatch:

concurrency:
  group: reset-guest-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Require the DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add a DATABASE_URL repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset the guest workspace
        run: pnpm demo:reset
