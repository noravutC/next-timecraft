name: Deploy

# Ships one main build to the EC2 box: migrations first, then
# scripts/deploy.sh over AWS Systems Manager (no SSH port, no keys). The
# script waits for /api/health and puts the previous image back if the new
# one doesn't come up, and this run fails so you hear about it.
#
# Started by hand: Actions > Deploy > Run workflow. Setup is in
# docs/deploy-aws.md ("Deploying from GitHub").
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit on main to deploy (blank: the latest)'
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # short-lived AWS credentials through OIDC, no stored keys

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      TAG: ${{ inputs.sha || github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check the inputs
        run: |
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN EC2_INSTANCE_ID DATABASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set (see docs/deploy-aws.md, Deploying from GitHub)."
              exit 1
            fi
          done
          # the tag ends up in a shell command on the server
          if ! [[ "$TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'$TAG' is not a full commit sha."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before the new code: migrations here only add things, so the old
      # version keeps working while the new one starts.
      - name: Apply migrations
        run: pnpm db:migrate

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deploy.sh on the server
        run: |
          script=$(base64 -w0 scripts/deploy.sh)
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $TAG" \
            --parameters "commands=[\"echo $script | base64 -d | sudo -u ubuntu -H bash -s -- $TAG\"]" \
            --query Command.CommandId --output text)

          status=Pending
          for _ in $(seq 1 60); do
            sleep 5
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending | InProgress | Delayed) ;; *) break ;; esac
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          if [ "$status" != Success ]; then
            echo "::error::Deploy ended as $status. If it says 'rolling back', the previous version is serving."
            exit 1
          fi
